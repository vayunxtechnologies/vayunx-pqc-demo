# VayunX PQC boardroom-demo — deployment stack
#
# Two services:
#   app   — the Node demo app (built from ./app), listens on 8080, NOT published
#           to the host. Only Caddy can reach it (over the internal compose network).
#   caddy — reverse proxy terminating TLS. This is the only public-facing service.
#
# Everything is parameterized via the environment (see .env.example). Copy
# .env.example to .env and fill in DOMAIN / TLS_EMAIL before `docker compose up`.

services:
  app:
    build: ./app
    restart: unless-stopped
    environment:
      # Which TLS/crypto posture the app advertises in its own UI/API.
      # The HOST TLS scan posture is controlled separately by the Caddyfile
      # (classical vs pqc); keep these in sync via the Makefile targets.
      SECURITY_PROFILE: ${SECURITY_PROFILE:-classical}
      PORT: 8080
      # Optional session cookie name/secret passed through from the env.
      SESSION_COOKIE: ${SESSION_COOKIE:-vayunx_demo}
    expose:
      # Reachable only inside the compose network — no host port publish.
      - "8080"
    networks: [default]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # Consumed by the Caddyfile via {$DOMAIN} / {$TLS_EMAIL}.
      DOMAIN: ${DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL}
    depends_on:
      - app
    # `default` reaches the demo `app`; `vayunx-net` (shared, external) lets this one Caddy
    # also reach the pqc-chat-app `web` container so a single proxy serves BOTH domains
    # (sampledemo.vayunx.com + chat.vayunx.com). Create it once: `docker network create vayunx-net`.
    networks: [default, vayunx-net]

volumes:
  caddy_data:
  caddy_config:

networks:
  vayunx-net:
    external: true
